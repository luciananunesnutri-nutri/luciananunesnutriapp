{% extends "base.html" %}
{% block title %}Cardápios — Luciana Nunes Nutri{% endblock %}
{% block content %}
<h5 class="section-title mb-3"><i class="bi bi-calendar3 me-2"></i>Cardápios ({{ cardapios|length }})</h5>

<div class="row g-3">
    {% for c in cardapios %}
    <div class="col-md-6 col-lg-4">
        <a href="/cadastros/cardapio/{{ c.CD_CARDAPIO }}" class="text-decoration-none">
            <div class="ava-card p-3 h-100">
                <h6 style="color:#333;font-weight:700;margin-bottom:0">{{ c.DS_CARDAPIO }}</h6>
            </div>
        </a>
    </div>
    {% endfor %}
</div>
{% endblock %}
