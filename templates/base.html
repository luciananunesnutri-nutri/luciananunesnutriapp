<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Luciana Nunes Nutri{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        :root {
            --ava-teal: #1a8a7d;
            --ava-teal-dark: #14706a;
            --ava-teal-light: #e0f5f3;
            --ava-orange: #e66b2e;
            --ava-orange-light: #fff4ee;
            --ava-green: #28a745;
            --ava-pink: #e91e8c;
            --ava-bg: #f4f6f5;
            --ava-sidebar-w: 220px;
        }
        * { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
        body { background: var(--ava-bg); margin: 0; }

        /* NAVBAR */
        .ava-navbar {
            background: linear-gradient(135deg, var(--ava-teal), var(--ava-teal-dark));
            padding: 0 24px;
            height: 52px;
            display: flex;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,.15);
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .ava-navbar .brand {
            color: #fff;
            font-weight: 800;
            font-size: 1.25rem;
            text-decoration: none;
            letter-spacing: .5px;
        }
        .ava-navbar .brand span { font-weight: 300; }
        .ava-navbar .nav-links {
            display: flex;
            align-items: center;
            gap: 4px;
            margin-left: 32px;
        }
        .ava-navbar .nav-links a {
            color: rgba(255,255,255,.8);
            text-decoration: none;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: .875rem;
            font-weight: 500;
            transition: all .15s;
        }
        .ava-navbar .nav-links a:hover,
        .ava-navbar .nav-links a.active { color: #fff; background: rgba(255,255,255,.15); }
        .ava-navbar .nav-links a i { margin-right: 5px; }

        /* PAGE CONTENT */
        .page-wrap { padding: 20px 28px 40px; max-width: 1400px; margin: 0 auto; }

        /* CARDS */
        .ava-card {
            background: #fff;
            border: 1px solid #e8ebe9;
            border-radius: 10px;
            overflow: hidden;
        }
        .ava-card-header {
            padding: 14px 20px;
            border-bottom: 1px solid #eee;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .ava-card-header h3 {
            margin: 0;
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--ava-orange);
        }
        .ava-card-body { padding: 20px; }

        /* SECTION TITLE */
        .section-title {
            color: var(--ava-orange);
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 16px;
        }

        /* STAT CARDS */
        .stat-card {
            background: #fff;
            border: 1px solid #e8ebe9;
            border-radius: 10px;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 14px;
            transition: transform .15s;
        }
        .stat-card:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(0,0,0,.06); }
        .stat-icon {
            width: 44px; height: 44px;
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem;
            flex-shrink: 0;
        }
        .stat-icon.teal { background: var(--ava-teal-light); color: var(--ava-teal); }
        .stat-icon.orange { background: var(--ava-orange-light); color: var(--ava-orange); }
        .stat-icon.green { background: #e8f5e9; color: #2e7d32; }
        .stat-icon.blue { background: #e3f2fd; color: #1565c0; }
        .stat-icon.purple { background: #f3e5f5; color: #7b1fa2; }
        .stat-icon.pink { background: #fce4ec; color: #c62828; }
        .stat-label { font-size: .78rem; color: #888; text-transform: uppercase; letter-spacing: .3px; }
        .stat-value { font-size: 1.5rem; font-weight: 700; color: #333; line-height: 1.1; }

        /* TABLES */
        .ava-table { width: 100%; border-collapse: collapse; }
        .ava-table th {
            font-size: .75rem; text-transform: uppercase; color: #999;
            font-weight: 600; letter-spacing: .3px;
            padding: 10px 12px; border-bottom: 2px solid #eee;
            white-space: nowrap;
        }
        .ava-table td { padding: 10px 12px; border-bottom: 1px solid #f2f2f2; font-size: .875rem; }
        .ava-table tbody tr:hover { background: #fafbfa; }

        /* BADGES */
        .badge-m { background: #1565c0; color: #fff; }
        .badge-f { background: #c2185b; color: #fff; }
        .badge-pill { border-radius: 20px; padding: 3px 10px; font-size: .75rem; font-weight: 600; }

        /* BUTTONS */
        .btn-ava { background: var(--ava-teal); color: #fff; border: none; border-radius: 6px; padding: 6px 16px; font-weight: 600; font-size: .85rem; }
        .btn-ava:hover { background: var(--ava-teal-dark); color: #fff; }
        .btn-ava-orange { background: var(--ava-orange); color: #fff; border: none; border-radius: 6px; padding: 6px 16px; font-weight: 600; font-size: .85rem; }
        .btn-ava-orange:hover { background: #d35a1e; color: #fff; }
        .btn-ava-green { background: var(--ava-green); color: #fff; border: none; border-radius: 6px; padding: 6px 16px; font-weight: 600; font-size: .85rem; }
        .btn-ava-green:hover { background: #218838; color: #fff; }
        .btn-ava-outline {
            background: transparent; color: var(--ava-teal);
            border: 1.5px solid var(--ava-teal); border-radius: 6px;
            padding: 5px 14px; font-weight: 600; font-size: .85rem;
        }
        .btn-ava-outline:hover { background: var(--ava-teal); color: #fff; }

        /* SEARCH */
        .search-box {
            border: 2px solid #dde0de;
            border-radius: 25px;
            padding: 7px 18px;
            font-size: .875rem;
            transition: border-color .15s;
        }
        .search-box:focus { border-color: var(--ava-teal); box-shadow: 0 0 0 .15rem rgba(26,138,125,.12); outline: none; }

        /* SIDEBAR for patient */
        .patient-layout { display: flex; gap: 0; min-height: calc(100vh - 52px); }
        .patient-sidebar {
            width: var(--ava-sidebar-w);
            background: #fff;
            border-right: 1px solid #e8ebe9;
            flex-shrink: 0;
            padding: 0;
        }
        .patient-sidebar .patient-photo {
            text-align: center;
            padding: 24px 16px 12px;
            border-bottom: 1px solid #eee;
        }
        .patient-sidebar .patient-photo .avatar {
            width: 80px; height: 80px;
            border-radius: 50%;
            background: var(--ava-teal-light);
            color: var(--ava-teal);
            display: inline-flex;
            align-items: center; justify-content: center;
            font-size: 2rem; font-weight: 700;
            margin-bottom: 8px;
        }
        .patient-sidebar .patient-photo .name {
            font-weight: 700; font-size: .9rem; color: #333;
            line-height: 1.2;
        }
        .patient-sidebar .patient-photo .info {
            font-size: .78rem; color: #888;
        }
        .patient-sidebar nav { padding: 8px 0; }
        .patient-sidebar nav a {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 20px;
            color: #555;
            text-decoration: none;
            font-size: .84rem;
            font-weight: 500;
            border-left: 3px solid transparent;
            transition: all .12s;
        }
        .patient-sidebar nav a:hover { background: #f5f7f6; color: var(--ava-teal); }
        .patient-sidebar nav a.active {
            background: var(--ava-teal-light);
            color: var(--ava-teal);
            border-left-color: var(--ava-teal);
            font-weight: 700;
        }
        .patient-sidebar nav a i { font-size: 1rem; width: 20px; text-align: center; }
        .patient-content { flex: 1; padding: 24px 28px; overflow-x: auto; }

        /* TABS */
        .ava-tabs {
            display: flex;
            gap: 0;
            border-bottom: 2px solid #eee;
            margin-bottom: 20px;
        }
        .ava-tabs a {
            padding: 10px 20px;
            text-decoration: none;
            font-size: .85rem;
            font-weight: 600;
            color: #888;
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
            transition: all .12s;
        }
        .ava-tabs a:hover { color: var(--ava-teal); }
        .ava-tabs a.active { color: var(--ava-teal); border-bottom-color: var(--ava-teal); }

        /* NUTRIENT GRID */
        .nutrient-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
            gap: 10px;
        }
        .nutrient-item {
            background: #f8f9f8;
            padding: 10px 14px;
            border-radius: 8px;
            border-left: 3px solid var(--ava-teal);
        }
        .nutrient-item .n-label { font-size: .72rem; color: #999; text-transform: uppercase; letter-spacing: .3px; }
        .nutrient-item .n-value { font-size: 1.05rem; font-weight: 700; color: #333; }

        /* MEAL HEADER */
        .meal-header {
            background: var(--ava-teal-light);
            color: var(--ava-teal-dark);
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 700;
            font-size: .9rem;
            margin: 16px 0 8px;
        }

        /* PAGINATION */
        .ava-pagination { display: flex; gap: 4px; justify-content: center; margin-top: 20px; }
        .ava-pagination a, .ava-pagination span {
            padding: 6px 12px; border-radius: 6px; font-size: .85rem;
            text-decoration: none; font-weight: 500;
        }
        .ava-pagination a { color: var(--ava-teal); border: 1px solid #ddd; }
        .ava-pagination a:hover { background: var(--ava-teal-light); }
        .ava-pagination span.active { background: var(--ava-teal); color: #fff; border: 1px solid var(--ava-teal); }
        .ava-pagination span.dots { border: none; color: #aaa; }

        /* INDICATOR BOX */
        .indicator-box {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 14px;
            background: #f8f9f8;
            border-radius: 8px;
            border: 1px solid #eee;
        }
        .indicator-box .ind-label { font-size: .78rem; color: #888; min-width: 120px; }
        .indicator-box .ind-value { font-weight: 700; font-size: .95rem; }
        .indicator-box .ind-unit { font-size: .78rem; color: #aaa; }

        /* COLOR INDICATORS */
        .ind-adequate { background: #d4edda; color: #155724; padding: 2px 10px; border-radius: 4px; font-weight: 600; font-size: .8rem; }
        .ind-high { background: #f8d7da; color: #721c24; padding: 2px 10px; border-radius: 4px; font-weight: 600; font-size: .8rem; }
        .ind-low { background: #fff3cd; color: #856404; padding: 2px 10px; border-radius: 4px; font-weight: 600; font-size: .8rem; }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .patient-layout { flex-direction: column; }
            .patient-sidebar { width: 100%; border-right: none; border-bottom: 1px solid #e8ebe9; }
            .patient-sidebar nav { display: flex; overflow-x: auto; padding: 0; }
            .patient-sidebar nav a { border-left: none; border-bottom: 3px solid transparent; white-space: nowrap; padding: 8px 14px; }
            .patient-sidebar nav a.active { border-left: none; border-bottom-color: var(--ava-teal); }
            .patient-content { padding: 16px; }
            .page-wrap { padding: 16px; }
            .nutrient-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
        }
    </style>
</head>
<body>
    <div class="ava-navbar">
        <a href="/" class="brand"><b>Luciana Nunes</b> <span>Nutri</span></a>
        <div class="nav-links">
            <a href="/" class="{{ 'active' if request.path == '/' }}"><i class="bi bi-house-door"></i>Home</a>
            <a href="/pacientes" class="{{ 'active' if '/paciente' in request.path }}"><i class="bi bi-people"></i>Pacientes</a>
            <a href="/cadastros" class="{{ 'active' if '/cadastro' in request.path }}"><i class="bi bi-folder2-open"></i>Cadastros</a>
            <a href="/acompanhamento" class="{{ 'active' if '/acompanhamento' in request.path }}"><i class="bi bi-clipboard-check"></i>Acompanhamento</a>
        </div>
    </div>
    {% block body %}
    <div class="page-wrap">
        {% block content %}{% endblock %}
    </div>
    {% endblock %}
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
