{% extends "base.html" %}
{% block title %}Medidas — Luciana Nunes Nutri{% endblock %}
{% block content %}
<h5 class="section-title mb-3"><i class="bi bi-rulers me-2"></i>Medidas Caseiras ({{ medidas|length }})</h5>

<div class="ava-card">
    <div class="ava-card-body" style="padding:0">
        <table class="ava-table">
            <thead>
                <tr>
                    <th>Código</th>
                    <th>Descrição</th>
                </tr>
            </thead>
            <tbody>
                {% for m in medidas %}
                <tr>
                    <td style="color:#aaa;width:100px">{{ m.Cd_Medida }}</td>
                    <td style="font-weight:600">{{ m.Ds_Medida }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
